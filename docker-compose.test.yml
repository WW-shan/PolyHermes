version: '3.8'

services:
  app:
    # 使用测试镜像（pre-release）
    image: wrbug/polyhermes:test
    container_name: polyhermes-test
    ports:
      - "${SERVER_PORT:-8080}:80"  # 使用不同端口避免冲突
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - SPRING_PROFILES_ACTIVE=test  # 使用测试 profile
      - DB_URL=${DB_URL:-jdbc:mysql://mysql-test:3306/polyhermes_test?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - SERVER_PORT=8000
      # 测试环境同样必须显式提供密钥（不再内置公开默认值），生成方式：openssl rand -hex 32
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set (openssl rand -hex 32)}
      - ADMIN_RESET_PASSWORD_KEY=${ADMIN_RESET_PASSWORD_KEY:?ADMIN_RESET_PASSWORD_KEY must be set (openssl rand -hex 32)}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-${CRYPTO_SECRET_KEY:?ENCRYPTION_KEY must be set (openssl rand -hex 32)}}
      - CRYPTO_SECRET_KEY=${CRYPTO_SECRET_KEY:-}
      - LOG_LEVEL_ROOT=DEBUG
      - LOG_LEVEL_APP=DEBUG
      # 【测试环境】允许检测 pre-release 版本
      - ALLOW_PRERELEASE=true
      - GITHUB_REPO=${GITHUB_REPO:-WrBug/PolyHermes}
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      mysql-test:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - polyhermes-test-network

  mysql-test:
    image: mysql:8.2
    container_name: polyhermes-mysql-test
    # 默认只绑定到本机回环地址；如确需远程访问，改为 "${MYSQL_PORT:-3308}:3306"
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3308}:3306"  # 使用不同端口
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-testpassword}
      - MYSQL_DATABASE=polyhermes_test
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    volumes:
      - mysql-test-data:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-testpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - polyhermes-test-network

volumes:
  mysql-test-data:

networks:
  polyhermes-test-network:
    driver: bridge
