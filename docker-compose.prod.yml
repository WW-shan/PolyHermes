version: '3.8'

# ⚠️ 重要（WW-shan fork）：
# 本文件默认拉取 wrbug/polyhermes:latest，不包含本 fork/本地分支的修复。
# 如果要运行本地代码，请使用仓库根目录的 docker-compose.yml 并执行：
#   docker compose -f docker-compose.yml up -d --build
# 详见 docs/zh/local-build-deployment.md
# ============================================================

# PolyHermes 生产环境部署配置
# 使用 Docker Hub 官方镜像，无需本地构建
# 
# 使用方法：
# 1. 创建 .env 文件（参考下方配置）
# 2. 运行: docker-compose -f docker-compose.prod.yml up -d
#
# 注意：
# - JWT_SECRET 和 ADMIN_RESET_PASSWORD_KEY 不能使用默认值
# - 请使用 openssl rand -hex 生成安全的随机密钥

services:
  app:
    # 使用 Docker Hub 官方镜像
    image: wrbug/polyhermes:latest
    container_name: polyhermes
    ports:
      - "${SERVER_PORT:-80}:80"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - DB_URL=${DB_URL:-jdbc:mysql://mysql:3306/polyhermes?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - SERVER_PORT=8000
      # ⚠️ 安全警告：以下两个环境变量不能使用默认值，否则容器启动会失败
      # 请在 .env 文件中设置，或通过环境变量传入
      # 生成随机密钥：openssl rand -hex 32 (ADMIN_RESET_PASSWORD_KEY) 或 openssl rand -hex 64 (JWT_SECRET)
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set (openssl rand -hex 32)}
      - ADMIN_RESET_PASSWORD_KEY=${ADMIN_RESET_PASSWORD_KEY:?ADMIN_RESET_PASSWORD_KEY must be set (openssl rand -hex 32)}
      # 数据加密密钥：优先 ENCRYPTION_KEY，兼容旧变量 CRYPTO_SECRET_KEY，都未设置时回退 JWT_SECRET
      # 旧部署数据可能由 JWT_SECRET 或 CRYPTO_SECRET_KEY 加密：后端会依次尝试这些旧密钥解密，并在启动时用当前密钥重新加密
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-${CRYPTO_SECRET_KEY:-${JWT_SECRET}}}
      - CRYPTO_SECRET_KEY=${CRYPTO_SECRET_KEY:-}
      # 日志级别配置（可选，默认值：root=WARN, app=INFO）
      # 可选值：TRACE, DEBUG, INFO, WARN, ERROR, OFF
      - LOG_LEVEL_ROOT=${LOG_LEVEL_ROOT:-WARN}
      - LOG_LEVEL_APP=${LOG_LEVEL_APP:-INFO}
      # 动态更新配置
      - ALLOW_PRERELEASE=${ALLOW_PRERELEASE:-false}
      - GITHUB_REPO=${GITHUB_REPO:-WrBug/PolyHermes}
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - polyhermes-network

  mysql:
    image: mysql:8.2
    container_name: polyhermes-mysql
    # 默认只绑定到本机回环地址，避免数据库暴露到公网
    # 如确需远程访问，改为 "${MYSQL_PORT:-3307}:3306"（并配置防火墙与强密码）
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-rootpassword}
      - MYSQL_DATABASE=polyhermes
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - polyhermes-network

volumes:
  mysql-data:

networks:
  polyhermes-network:
    driver: bridge
